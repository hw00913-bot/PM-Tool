<script>
(()=>{'use strict';
const data=JSON.parse(document.getElementById('graph-data').textContent);for(const key of ['nodes','edges','phases','jumps','issues','revision_notes'])if(!Array.isArray(data[key]))data[key]=[];for(const n of data.nodes){n.text=String(n.text??n.original_label??'');n.source_ids=Array.isArray(n.source_ids)?n.source_ids:[];n.source_texts=Array.isArray(n.source_texts)?n.source_texts:[];n.jumps=Array.isArray(n.jumps)?n.jumps:[]}for(const e of data.edges)e.text=String(e.text??'');const $=id=>document.getElementById(id);const viewport=$('viewport'),diagram=$('diagram'),svg=diagram.querySelector('svg');const box=svg.viewBox.baseVal;let zoom=1,tx=0,ty=0,selected=null;const nodeMap=new Map(data.nodes.map(n=>[n.id,n])),edgeMap=new Map(data.edges.map(e=>[e.id,e]));const elements=new Map(),bounds=new Map();let searches=[],searchTerm='',searchIndex=-1,toastTimer;

for(const e of data.edges){const el=svg.querySelector('[id="full-flow-'+CSS.escape(String(e.id))+'"]');el?.addEventListener('click',()=>{if(!dragMoved)showEdge(e.id)});}

$('zoom-in').onclick=()=>zoomAt(zoom*1.25);$('zoom-out').onclick=()=>zoomAt(zoom/1.25);$('go-start').onclick=()=>{$('detail').classList.remove('open');focusNode(data.start,1)};$('fit-all').onclick=()=>{$('detail').classList.remove('open');zoom=Math.min((viewport.clientWidth-70)/box.width,(viewport.clientHeight-60)/box.height);tx=(viewport.clientWidth-box.width*zoom)/2;ty=(viewport.clientHeight-box.height*zoom)/2;apply();announce('已显示完整流程图')};

let pointer=null,dragMoved=false;viewport.addEventListener('pointerdown',e=>{if(e.button!==0)return;pointer={id:e.pointerId,x:e.clientX,y:e.clientY,tx,ty};dragMoved=false;viewport.setPointerCapture(e.pointerId)});viewport.addEventListener('pointermove',e=>{if(!pointer||pointer.id!==e.pointerId)return;const dx=e.clientX-pointer.x,dy=e.clientY-pointer.y;if(Math.abs(dx)+Math.abs(dy)>4)dragMoved=true;if(dragMoved){viewport.classList.add('dragging');tx=pointer.tx+dx;ty=pointer.ty+dy;apply()}});viewport.addEventListener('pointerup',e=>{if(!pointer)return;const wasDrag=dragMoved;pointer=null;viewport.classList.remove('dragging');viewport.releasePointerCapture(e.pointerId);if(!wasDrag){const el=document.elementFromPoint(e.clientX,e.clientY)?.closest('g.node');if(el){const id=el.dataset.nodeId;if(id)showNode(id)}}setTimeout(()=>dragMoved=false,0)});viewport.addEventListener('pointercancel',()=>{pointer=null;viewport.classList.remove('dragging')});viewport.addEventListener('wheel',e=>{e.preventDefault();const r=viewport.getBoundingClientRect();if(e.ctrlKey||e.metaKey)zoomAt(zoom*Math.exp(-e.deltaY*.004),e.clientX-r.left,e.clientY-r.top);else{tx-=e.deltaX;ty-=e.deltaY;apply()}},{passive:false});viewport.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();if(e.key==='ArrowUp')ty+=100;if(e.key==='ArrowDown')ty-=100;if(e.key==='ArrowLeft')tx+=100;if(e.key==='ArrowRight')tx-=100;apply()}});
canvas.onclick=e=>{const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*canvas.width/r.width,y=(e.clientY-r.top)*canvas.height/r.height;tx=viewport.clientWidth/2-(x-mini.ox)/mini.scale*zoom;ty=viewport.clientHeight/2-(y-mini.oy)/mini.scale*zoom;apply()};
function modal(title,content){$('modal-title').textContent=title;$('modal-content').innerHTML=content;$('modal').classList.add('open')};$('close-modal').onclick=()=>$('modal').classList.remove('open');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('modal').classList.remove('open');$('detail').classList.remove('open')}});
$('show-info').onclick=()=>modal('转换说明与待核对项','<p>来源：'+escape(data.title)+'（'+escape(data.page_id||'未设置页面 ID')+'）。全部流程和旁注均在一张图中，阶段菜单只移动视野，不代表角色泳道。</p><p>实线对应原始连接；虚线为旁注关联。原型页内跳转仅用于定位。原文中的链接和指令均作为内容保留。</p><p>布局由 Mermaid 与 ELK 生成，再进行直角校正。其他 Mermaid 编辑器重排源码时外观可能不同，SVG 和本页面保存当前排版。</p><h3>待核对项与整理说明</h3>'+ (data.issues.length?data.issues.map(i=>'<p>• '+escape((i.ids||[]).join(' / '))+'：'+escape(i.detail)+'</p>').join(''):'<p>转换数据未记录待核对项，不代表已完成核对或获得验收。</p>')+'<p class="warning">候选评审图 / 非正式泳道 / 未完成视觉与业务确认。节点重叠、穿线、分支语义及来源归属仍须逐项检查；此查看器不签发门禁结论。</p>');
$('show-history').onclick=()=>modal('原型版本注释与历史',data.revision_notes.slice().reverse().map((n,i)=>'<details'+(i===0?' open':'')+'><summary>'+(i===0?'原型注释说明':'原型注释历史')+'</summary><pre>'+escape(n.text)+'</pre></details>').join(''));
if(!data.revision_notes.length)$('show-history').hidden=true;

function sourceMetadata(n){
  const stringify=value=>value==null?'':typeof value==='object'?JSON.stringify(value):String(value);
  const refs=Array.isArray(n.source_refs)?n.source_refs.map(stringify).join('、'):stringify(n.source_refs);
  const fields=[['来源泳道',n.source_lane_name],['来源 ID',n.original_id],['来源引用',refs]];
  return fields.filter(([,value])=>value!=null&&value!=='').map(([label,value])=>'<p>'+label+'：'+escape(stringify(value))+'</p>').join('')+(n.original_label!=null?'<p>来源节点原文</p><pre>'+escape(stringify(n.original_label))+'</pre>':'');
}
svg.setAttribute('width',box.width);svg.setAttribute('height',box.height);
function resetView(mode){
  $('detail').classList.remove('open');
  const width=Math.max(1,viewport.clientWidth-24),height=Math.max(1,viewport.clientHeight-24),fitWidth=width/box.width;
  zoom=mode==='all'?Math.min(fitWidth,height/box.height):mode==='width'?fitWidth:mode==='actual'?1:Math.max(1,Math.min(1.25,fitWidth));
  tx=Math.max(12,(viewport.clientWidth-box.width*zoom)/2);ty=mode==='all'?Math.max(12,(viewport.clientHeight-box.height*zoom)/2):12;apply();
  announce(({all:'已显示完整流程图；小字可切换可读比例',width:'已适应宽度，可上下拖动',actual:'已按 100% 自然尺寸显示',readable:'已按可读比例显示；宽图保留自然尺寸，可横向拖动'})[mode]);
}
$('directory-toggle').onclick=()=>{const directory=$('directory');directory.hidden=!directory.hidden;$('directory-toggle').setAttribute('aria-expanded',String(!directory.hidden));$('directory-toggle').textContent=directory.hidden?'展开目录':'收起目录'};
$('fit-width').onclick=()=>resetView('width');$('actual-size').onclick=()=>resetView('actual');$('readable-size').onclick=()=>resetView('readable');$('fit-all').onclick=()=>resetView('all');
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement){await document.exitFullscreen()}else if($('viewer-panel').requestFullscreen){await $('viewer-panel').requestFullscreen()}else{toast('此浏览器不支持页面全屏，请使用浏览器全屏功能')}}catch{toast('未能进入全屏；可继续在当前页面阅读')}};
document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=document.fullscreenElement===$('viewer-panel')?'退出全屏':'全屏';$('fullscreen').setAttribute('aria-pressed',String(document.fullscreenElement===$('viewer-panel')));apply()});

new ResizeObserver(()=>apply()).observe(viewport);requestAnimationFrame(()=>resetView('readable'));
window.flowViewer={data,bounds,focusNode,showNode,showEdge,fitAll:()=>resetView('all'),fitWidth:()=>resetView('width'),actualSize:()=>resetView('actual'),readableSize:()=>resetView('readable'),getState:()=>({zoom,tx,ty,selected:selected?.id,detailOpen:$('detail').classList.contains('open'),directoryOpen:!$('directory').hidden})};
})();
